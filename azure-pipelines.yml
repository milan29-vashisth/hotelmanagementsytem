trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  acrName: milanacr2026
  acrLoginServer: milanacr2026.azurecr.io
  imageName: hotel-app
  imageTag: $(Build.BuildId)

stages:

- stage: Build
  displayName: Build, SonarQube and Push Docker Image

  jobs:
  - job: BuildPush
    displayName: Build and Push

    steps:

    - task: SonarQubePrepare@8
      displayName: Prepare SonarQube Analysis
      inputs:
        SonarQube: 'Sonar-Qube-Token-SVC'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'hotel-app'
        cliProjectName: 'hotel-app'
        cliSources: '.'
        extraProperties: |
          sonar.projectKey=hotel-app
          sonar.projectName=hotel-app
       
    - task: SonarQubeAnalyze@8
      displayName: Run SonarQube Analysis

    - task: SonarQubePublish@8
      displayName: Publish SonarQube Results
      inputs:
        pollingTimeoutSec: '300'

    - task: AzureCLI@2
      displayName: Login to Azure and ACR
      inputs:
        azureSubscription: 'app-hotel-coonection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "======================================"
          echo "Logging into Azure..."
          echo "======================================"

          az account show

          echo "======================================"
          echo "Logging into ACR..."
          echo "======================================"

          az acr login --name $(acrName)

          echo "ACR login successful."

    - script: |
        echo "======================================"
        echo "Building Docker Image..."
        echo "======================================"

        docker build \
          -t $(acrLoginServer)/$(imageName):$(imageTag) \
          .

        echo "======================================"
        echo "Docker Image Built Successfully"
        echo "======================================"

        docker images | grep hotel-app
      displayName: Build Docker Image

    - script: |
        echo "======================================"
        echo "Pushing Docker Image to ACR..."
        echo "======================================"

        docker push $(acrLoginServer)/$(imageName):$(imageTag)

        echo "======================================"
        echo "Docker Image Pushed Successfully"
        echo "======================================"

        echo "Image:"
        echo "$(acrLoginServer)/$(imageName):$(imageTag)"
      displayName: Push Docker Image


- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployAKS
    displayName: Deploy Image to AKS

    steps:

    - task: AzureCLI@2
      displayName: Connect to AKS and Deploy
      inputs:
        azureSubscription: 'app-hotel-coonection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "======================================"
          echo "Connecting to AKS..."
          echo "======================================"

          az aks get-credentials \
            --resource-group app-test-dev-rg \
            --name hotel-aks-dev \
            --overwrite-existing

          echo "AKS connection successful."

          echo "======================================"
          echo "Current Pods"
          echo "======================================"

          kubectl get pods -n hotel-app-dev

          echo "======================================"
          echo "Updating Deployment Image..."
          echo "======================================"

          kubectl set image deployment/hotel-app \
            hotel-app=$(acrLoginServer)/$(imageName):$(imageTag) \
            -n hotel-app-dev

          echo "======================================"
          echo "Waiting for Rollout..."
          echo "======================================"

          kubectl rollout status deployment/hotel-app \
            -n hotel-app-dev \
            --timeout=300s

          echo "======================================"
          echo "Current Deployment Image"
          echo "======================================"

          kubectl describe deployment hotel-app \
            -n hotel-app-dev | grep -i "Image:"

          echo "======================================"
          echo "Final Pod Status"
          echo "======================================"

          kubectl get pods -n hotel-app-dev -o wide

          echo "======================================"
          echo "Deployment Completed Successfully"
          echo "======================================"